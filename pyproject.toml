[project]
name = "hospital"
version = "0.1.0"
description = "Example library for hospital and geometry classes"
authors = [{ name = "Olsa Berani" }]
requires-python = ">=3.10"
dependencies = [
    "geopy>=2.4.1",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
